services:
  backuply:
    build:
      context: .
      dockerfile: Dockerfile
    image: shadowkrad/backuply:latest
    container_name: backuply
    restart: unless-stopped
    ports:
      - "3005:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TZ=Europe/Rome
      - TAAAAC_CORE_URL=https://taaaac.eu
      - BACKUPLY_SECRET_TOKEN=taaaac-backuply-secure-token
      - BACKUPLY_STORAGE_PATH=/backups
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - TELEGRAM_ALERTS_ENABLED=${TELEGRAM_ALERTS_ENABLED:-true}
    volumes:
      # Dati applicativi e impostazioni di Backuply
      - ./data:/app/data
      # Cartella archivio immutabile backup: di default cartella locale ./backups, 
      # oppure mount point dello storage pool QNAP (es. /mnt/backups o /share/Backups)
      - ./backups:/backups
